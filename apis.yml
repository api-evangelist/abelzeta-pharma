description: 'AbelZeta Pharma is a global clinical-stage cell therapy company discovering,
  developing, and manufacturing T-cell-based immunotherapeutics for cancer and immunological
  diseases. Its pipeline centers on Chimeric Antigen Receptor (CAR)-T cell technology
  across hematologic malignancies, solid tumors, and inflammatory and immunological
  conditions. Backed by Hongshan (formerly Sequoia Capital China), AbelZeta develops
  personalized immune cell therapies that empower patients'' own immune systems to
  address unmet medical needs, with operations in the United States (Maryland) and
  China. AbelZeta does not currently publish a public developer API; this profile
  captures the company''s corporate web presence and identity within the API Evangelist
  network.'
